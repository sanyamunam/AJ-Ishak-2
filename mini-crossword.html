<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Jazeera — The Mini Crossword</title>
<link rel="stylesheet" href="css/aj-games-skeleton.css">
</head>
<body>
  <div class="aj-skel-wrap" role="status" aria-live="polite">
    <div class="aj-skel-strip"></div>
    <h1 class="aj-skel-title">The Mini Crossword</h1>
    <p class="aj-skel-subtitle">Solve this bite-sized puzzle in just a few minutes.</p>
    <div class="aj-skel-panel">
      <div class="aj-skel-timer"><span class="aj-skel-spinner" aria-hidden="true"></span>0:00</div>
      <div class="aj-skel-crossword" aria-hidden="true">
        <span></span><span></span><span></span><span class="blk"></span><span></span>
        <span></span><span></span><span class="blk"></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span class="blk"></span><span></span><span></span>
        <span></span><span class="blk"></span><span></span><span></span><span></span>
      </div>
      <div class="aj-skel-status">Loading puzzle…</div>
    </div>
  </div>
  <script>
    /* Skeleton shows for ~500 ms so it's visibly a crossword grid, then
       we hand off to aljazeera-games.html with the #crossword hash so the
       existing aj-quiz.js flip-to-crossword flow runs and its own mask
       (data-cw-load) keeps the destination hidden until the crossword
       view has mounted. */
    setTimeout(function () {
      location.replace('aljazeera-games.html#crossword');
    }, 500);
  </script>
</body>
</html>
